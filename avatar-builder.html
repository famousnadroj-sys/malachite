<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Créer mon avatar 3D · Malachite</title>
<style>
*{box-sizing:border-box}html,body,#root{margin:0;width:100%;height:100%;min-height:100%;font:14px system-ui,-apple-system,sans-serif;color:#222;background:#fff}
.app{height:100dvh;display:flex;flex-direction:column;padding:12px;gap:10px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:750;font-size:18px}.hint{font-size:12px;color:#777;margin-top:3px}.gender{display:flex;gap:8px}.gender button,.close{border:1px solid #ead6df;background:#fff;border-radius:999px;padding:9px 16px;font-weight:650;color:#67334a}.gender button.active{background:#b72e63;color:white;border-color:#b72e63}.close{padding:8px 13px}.editor{flex:1;min-height:0}.loading{padding:24px;text-align:center;color:#666}.error{padding:18px;color:#a00}.hf-root{height:100%!important;min-height:0!important}.hf-editor{height:100%!important;min-height:0!important;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(220px,48%) minmax(0,1fr)!important;border-radius:14px!important}.hf-stage{min-height:220px!important}.hf-panel{border-left:0!important;border-top:1px solid #eceef1!important}.hf-save{background:#b72e63!important}
</style>
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@18.3.1","react/jsx-runtime":"https://esm.sh/react@18.3.1/jsx-runtime","react-dom":"https://esm.sh/react-dom@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client","three":"https://esm.sh/three@0.186.0","three/":"https://esm.sh/three@0.186.0/"}}
</script>
</head>
<body><div id="root"><div class="loading">Chargement du créateur 3D…</div></div>
<script type="module">
import React,{useState,useEffect} from 'react';
import{createRoot}from'react-dom/client';
import{HumanEditor,useHumanPackage}from'https://esm.sh/humanforge@0.8.1/web?external=react,react-dom,three';
const h=React.createElement,ASSETS='https://cdn.jsdelivr.net/gh/abdulrehman043/humanforge@v0.5.0/assets/human';
function App(){
 const [gender,setGender]=useState(new URLSearchParams(location.search).get('gender')==='female'?'female':'male');
 const [saved,setSaved]=useState(false);
 const {pkg,error}=useHumanPackage(ASSETS);
 useEffect(()=>{function receive(e){if(e.origin!==location.origin||!e.data||e.data.source!=='malachite-avatar-parent'||e.data.type!=='set-gender')return;setGender(e.data.gender==='female'?'female':'male');setSaved(false)}window.addEventListener('message',receive);return()=>window.removeEventListener('message',receive)},[]);
 function cancel(){parent.postMessage({source:'malachite-avatar-builder',type:'cancel'},location.origin)}
 function save(config,image){
  if(!image){alert('La capture 3D n’a pas pu être créée. Réessaie.');return}
  parent.postMessage({source:'malachite-avatar-builder',type:'save',config,image},location.origin);
  setSaved(true);
 }
 if(error)return h('div',{className:'error'},'Impossible de charger les modèles 3D : '+error.message);
 return h('div',{className:'app'},
  h('header',{className:'head'},h('div',null,h('div',{className:'title'},'Mon avatar 3D réaliste'),h('div',{className:'hint'},'Personnage virtuel · réglages du visage, cheveux et vêtements')),h('button',{className:'close',onClick:cancel},'Fermer')),
  h('div',{className:'gender'},h('button',{className:gender==='male'?'active':'',onClick:()=>{setGender('male');setSaved(false)}},'Homme'),h('button',{className:gender==='female'?'active':'',onClick:()=>{setGender('female');setSaved(false)}},'Femme')),
  h('div',{className:'editor'},!pkg?h('div',{className:'loading'},'Préparation des modèles 3D…'):h(HumanEditor,{key:gender,pkg,options:{gender,sections:['face','skin','eyes','brows','nose','mouth','hair','body','outfit','shoes'],detailRange:.65},randomize:false,selfie:false,accentColor:'#b72e63',background:'#eee9e7',saveLabel:'Appliquer sur mon profil',onSave:save}))
 );
}
createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
