<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Créer mon avatar 3D · Malachite</title>
<link rel="preconnect" href="https://esm.sh" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="dns-prefetch" href="//esm.sh"><link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<style>
*{box-sizing:border-box}html,body,#root{margin:0;width:100%;height:100%;min-height:100%;font:14px system-ui,-apple-system,sans-serif;color:#222;background:#fff}
.app{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:750;font-size:18px}.hint{font-size:12px;color:#777;margin-top:3px}.gender{display:flex;gap:8px}.gender button,.close,.toolbar button{border:1px solid #ead6df;background:#fff;border-radius:999px;padding:8px 14px;font-weight:650;color:#67334a}.gender button.active,.toolbar button.active{background:#b72e63;color:white;border-color:#b72e63}.close{padding:8px 13px}.editor{flex:1;min-height:0;display:grid;grid-template-rows:minmax(210px,48%) minmax(0,1fr);border:1px solid #eceef1;border-radius:14px;overflow:hidden}.stage{position:relative;min-height:210px;background:#eee9e7}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.toolbar{position:absolute;top:9px;left:9px;display:flex;gap:6px}.toolbar button{padding:6px 11px;font-size:12px}.panel{display:flex;flex-direction:column;min-height:0;border-top:1px solid #eceef1}.tabs{display:flex;gap:5px;overflow-x:auto;padding:8px;scrollbar-width:none}.tabs button{flex:none;border:0;border-radius:999px;background:#f1f2f4;padding:7px 11px;font-size:12px;color:#444}.tabs button.active{background:#b72e63;color:#fff}.controls{flex:1;overflow:auto;padding:6px 12px 12px}.control-row{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;align-items:center;gap:8px;margin:12px 0}.control-row input{width:100%;accent-color:#b72e63}.control-label{font-size:12px;color:#555}.control-value{font-size:11px;color:#777;text-align:right;font-variant-numeric:tabular-nums}.block{margin:10px 0}.block-title{display:block;font-size:12px;font-weight:650;color:#555;margin-bottom:7px}.swatches{display:flex;flex-wrap:wrap;gap:9px}.swatch{width:31px;height:31px;border-radius:50%;border:2px solid #ddd;padding:0}.swatch.active{outline:2px solid #b72e63;outline-offset:2px}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}.tile{aspect-ratio:1;border:1px solid #ddd;border-radius:9px;background:#fff;overflow:hidden;padding:3px}.tile.active{border:2px solid #b72e63}.tile img{width:100%;height:100%;object-fit:contain}.tile span{font-size:10px}.save{flex:none;border:0;border-radius:12px;background:#b72e63;color:#fff;padding:12px;font-weight:750}.loading{padding:24px;text-align:center;color:#666}.error{padding:18px;color:#a00}
</style>
<script type="importmap">
{"imports":{"react":"https://esm.sh/react@18.3.1","react/jsx-runtime":"https://esm.sh/react@18.3.1/jsx-runtime","react-dom":"https://esm.sh/react-dom@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client","three":"https://esm.sh/three@0.186.0","three/":"https://esm.sh/three@0.186.0/"}}
</script>
</head>
<body><div id="root"><div class="loading">Chargement du créateur 3D…</div></div>
<script type="module">
import React,{useState,useEffect,useMemo,useRef} from 'react';
import{createRoot}from'react-dom/client';
import{HumanCanvas,createHumanEditor,useHumanPackage}from'https://esm.sh/humanforge@0.8.1/web?external=react,react-dom,three';
const h=React.createElement,ASSETS='https://cdn.jsdelivr.net/gh/abdulrehman043/humanforge@v0.5.0/assets/human';
function App(){
 const [gender,setGender]=useState(new URLSearchParams(location.search).get('gender')==='female'?'female':'male');
 const [config,setConfig]=useState(null),[sectionIndex,setSectionIndex]=useState(0),[framing,setFraming]=useState('face'),[avatarReady,setAvatarReady]=useState(false);
 const canvas=useRef(null);
 const {pkg,error}=useHumanPackage(ASSETS);
 const options=useMemo(()=>({gender,sections:['face','skin','eyes','brows','nose','mouth','hair','body','outfit','shoes'],detailRange:.65}),[gender]);
 const editor=useMemo(()=>pkg?createHumanEditor(pkg,options):null,[pkg,options]);
 useEffect(()=>{if(editor){setAvatarReady(false);setConfig(editor.normalize(null));setSectionIndex(0)}},[editor]);
 useEffect(()=>{function receive(e){if(e.origin!==location.origin||!e.data||e.data.source!=='malachite-avatar-parent'||e.data.type!=='set-gender')return;setGender(e.data.gender==='female'?'female':'male')}window.addEventListener('message',receive);parent.postMessage({source:'malachite-avatar-builder',type:'mounted'},location.origin);return()=>window.removeEventListener('message',receive)},[]);
 function cancel(){parent.postMessage({source:'malachite-avatar-builder',type:'cancel'},location.origin)}
 function save(){if(!config||!canvas.current||!avatarReady)return;const image=canvas.current.snapshot();if(!image){alert('La capture 3D n’a pas pu être créée. Réessaie.');return}parent.postMessage({source:'malachite-avatar-builder',type:'save',config,image},location.origin)}
 function update(next){setConfig(editor.normalize(next))}
 function control(ctl){
  const value=ctl.value(config);
  if(ctl.kind==='slider')return h('label',{className:'control-row',key:ctl.id},h('span',{className:'control-label'},ctl.label),h('input',{type:'range',min:ctl.min,max:ctl.max,step:ctl.step,value,onChange:e=>update(ctl.apply(config,Number(e.target.value)))}),h('span',{className:'control-value'},Number(value).toFixed(2)));
  if(ctl.kind==='color')return h('div',{className:'block',key:ctl.id},h('span',{className:'block-title'},ctl.label),h('div',{className:'swatches'},ctl.colors.map(c=>h('button',{key:c,type:'button',className:'swatch'+(String(value).toLowerCase()===c.toLowerCase()?' active':''),style:{background:c},title:c,'aria-label':c,onClick:()=>update(ctl.apply(config,c))}))));
  if(ctl.display==='swatch')return h('div',{className:'block',key:ctl.id},h('span',{className:'block-title'},ctl.label),h('div',{className:'swatches'},ctl.options.map(o=>h('button',{key:o.id??'none',type:'button',className:'swatch'+(o.id===value?' active':''),style:{background:o.preview?'center/cover url("'+o.preview+'")':(o.swatch||'#eee')},title:o.label,'aria-label':o.label,onClick:()=>update(ctl.apply(config,o.id))}))));
  return h('div',{className:'block',key:ctl.id},h('span',{className:'block-title'},ctl.label),h('div',{className:'tiles'},ctl.options.map(o=>h('button',{key:o.id??'none',type:'button',className:'tile'+(o.id===value?' active':''),title:o.label,'aria-label':o.label,onClick:()=>update(ctl.apply(config,o.id))},o.id===null?h('span',null,'Aucun'):o.preview?h('img',{src:o.preview,alt:'',loading:'lazy'}):h('span',null,o.label)))));
 }
 if(error)return h('div',{className:'error'},'Impossible de charger les modèles 3D : '+error.message);
 if(!pkg||!editor||!config)return h('div',{className:'loading'},'Préparation du modèle humain 3D…');
 const section=editor.sections[Math.min(sectionIndex,editor.sections.length-1)];
 return h('div',{className:'app'},
  h('header',{className:'head'},h('div',null,h('div',{className:'title'},'Mon avatar 3D réaliste'),h('div',{className:'hint'},'Personnage virtuel · visage, peau, cheveux et vêtements')),h('button',{className:'close',onClick:cancel},'Fermer')),
  h('div',{className:'gender'},h('button',{className:gender==='male'?'active':'',onClick:()=>{setAvatarReady(false);setGender('male')}},'Homme'),h('button',{className:gender==='female'?'active':'',onClick:()=>{setAvatarReady(false);setGender('female')}},'Femme')),
  h('div',{className:'editor'},
   h('div',{className:'stage'},h(HumanCanvas,{ref:canvas,pkg,config,framing,background:'#eee9e7',textureSize:'512',rotatable:true,style:{position:'absolute',inset:0,width:'100%',height:'100%'},onReady:()=>{setAvatarReady(true);parent.postMessage({source:'malachite-avatar-builder',type:'ready'},location.origin)}}),h('div',{className:'toolbar'},h('button',{className:framing==='face'?'active':'',onClick:()=>setFraming('face')},'Visage'),h('button',{className:framing==='body'?'active':'',onClick:()=>setFraming('body')},'Corps'))),
   h('div',{className:'panel'},h('div',{className:'tabs'},editor.sections.map((item,i)=>h('button',{key:item.id,className:i===sectionIndex?'active':'',onClick:()=>setSectionIndex(i)},item.label))),h('div',{className:'controls'},section.controls.map(control)),h('button',{className:'save',onClick:save,disabled:!avatarReady,style:{opacity:avatarReady?1:.55}},avatarReady?'Appliquer sur mon profil':'Préparation du modèle 3D…'))
  )
 );
}
createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
