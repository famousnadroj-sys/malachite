<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#D81B60">
  <meta name="robots" content="noindex,follow">
  <title>Page introuvable — MALACHITE</title>
  <style>
    :root{color-scheme:light;--ink:#321624;--muted:#765968;--pink:#D81B60;--soft:#fff0f6;--line:#f0d4e0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 85% 10%,#ffe2ed 0,transparent 42%),#fff;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,560px);padding:clamp(26px,6vw,48px);border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 22px 70px #48162a12;text-align:center}
    .mark{width:66px;height:66px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#D81B60,#ff8fb8);color:#fff;font-size:38px;font-weight:800}
    .code{color:var(--pink);font-size:13px;font-weight:800;letter-spacing:.16em}
    h1{margin:8px 0 12px;font-size:clamp(30px,7vw,46px);line-height:1.08;letter-spacing:-.04em}
    p{margin:0 auto;color:var(--muted);max-width:390px}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
    a{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-weight:750;text-decoration:none}
    a.primary{background:var(--pink);border-color:var(--pink);color:#fff}
    a:focus-visible{outline:3px solid #8f1647;outline-offset:3px}
    footer{margin-top:26px;color:#947d89;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♡</div>
    <div class="code">ERREUR 404</div>
    <h1>Cette page n’existe pas.</h1>
    <p>Le lien est peut-être ancien ou l’adresse a été mal saisie. Tu peux revenir à l’accueil et continuer à découvrir MALACHITE.</p>
    <div class="actions">
      <a class="primary" href="./">Retour à l’accueil</a>
      <a href="./decouvrir.html">Découvrir MALACHITE</a>
    </div>
    <footer>© MALACHITE · Lubumbashi, RDC</footer>
  </main>
</body>
</html>
