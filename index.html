  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email||''))return showFieldError('suEmail','Saisis une adresse e-mail valide.');
  if((d.password||'').length<8)return showFieldError('suPassword','8 caractères minimum.');

async function auth(){
 if(window.bz)return;window.bz=1;var unlock=function(){window.bz=0};msg='';clearFieldErrors();
 try{
  if(mode==='up'){
   signupCollect();var d=signupDraft||{},age=Number(d.age);
   if(signupStep!==3)throw new Error('Termine les trois étapes avant de créer ton compte.');
   if(!d.prenom)return showFieldError('suFirst','Indique ton nom affiché.');
   if(!d.username)return showFieldError('suUsername','Indique ton nom d’utilisateur.');
   if(!d.email)return showFieldError('suEmail','Indique ton adresse e-mail.');
   if(!Number.isInteger(age)||age<18||age>100)return showFieldError('suAge','Malachite est réservé aux personnes de 18 ans et plus.');
   if(!d.consent)return showFieldError('malConsent','Tu dois accepter les conditions pour créer ton compte.');
   pendingSignupEmail=d.email;pendingProfileFile=pendingSignupPhoto;pendingProfilePreview=pendingSignupPreview;
   var metadata={prenom:d.prenom,username:d.username,nom_complet:d.prenom,telephone:d.telephone||'',age:age,profession:d.profession||'',genre:d.genre||'H',commune:d.commune||'Lubumbashi',quartier:'',bio:d.bio||'',profile_visibility:'public',relation_pref:d.relation||'Amour',malachite_consent:true};
   var r=await sb.auth.signUp({email:d.email,password:d.password,options:{data:metadata}});
   if(r.error)throw r.error;
   if(!r.data.session){
    loginPrefillEmail=d.email;mode='in';signupDraft={};msg='Compte créé. Vérifie ta boîte e-mail et clique sur le lien de confirmation. Ensuite, connecte-toi avec ton e-mail ou ton nom d’utilisateur.';
    draw();return;
   }
   signupDraft={};tab='home';msg='';
  }else{
   var ident=$('loginId')?$('loginId').value.trim():'',p=$('pw')?$('pw').value:'';
   if(!ident)return showFieldError('loginId','Saisis ton e-mail ou ton nom d’utilisateur.');
   if(!p)return showFieldError('pw','Saisis ton mot de passe.');
   if(ident.indexOf('@')>-1){
    var r=await sb.auth.signInWithPassword({email:ident,password:p});
    if(r.error)throw r.error;
   }else{
    var r=await sb.functions.invoke('username-login',{body:{username:ident,password:p}});
    if(r.error||!r.data||!r.data.session)throw new Error(r.data&&r.data.error?r.data.error:(r.error&&r.error.message)||'Identifiants incorrects.');
    var set=await sb.auth.setSession({access_token:r.data.session.access_token,refresh_token:r.data.session.refresh_token});
    if(set.error)throw set.error;
   }
   loginPrefillEmail='';tab='home';msg='';
  }
 }catch(err){
  var raw=err&&err.message?err.message:'Impossible de traiter cette demande.';
  if(/already registered|already exists|user already/i.test(raw))showFieldError('suEmail','Cette adresse e-mail est déjà utilisée. Connecte-toi ou utilise une autre adresse.');
  else if(/username|duplicate key|profiles_username/i.test(raw))showFieldError(mode==='up'?'suUsername':'loginId','Ce nom d’utilisateur est indisponible ou incorrect.');
  else if(mode==='in')showFieldError('pw','E-mail/nom d’utilisateur ou mot de passe incorrect.');
  else{msg=raw;var ae=$('ae');if(ae)ae.textContent=msg}
 }finally{unlock()}
}

fr:{title:'Centre Malachite',intro:'Personnalise ton expérience, consulte les règles et contacte notre assistance.',language:'Langue de l’interface',avatar:'Créer mon personnage',avatarHelp:'Choisis un personnage original, sa couleur et enregistre ton avatar sur ton profil.',save:'Enregistrer',payments:'Paiements Mobile Money RDC',airtel:'Airtel Money',orange:'Orange Money',paySteps:'Procédure de paiement',legal:'Conditions et confidentialité',terms:'Conditions d’utilisation',privacy:'Politique de confidentialité',safety:'Sécurité des rencontres',support:'Réclamations et assistance',category:'Catégorie',subject:'Objet',message:'Décris ta demande',send:'Envoyer la réclamation',sent:'Demande transmise à l’assistance.',noAuth:'Connecte-toi pour envoyer une réclamation.',numbers:'Numéros destinataires fournis par le propriétaire du site',manual:'Paiement manuel : Malachite ne lit pas les SMS de ton téléphone et ne confirme pas automatiquement un transfert. Garde la référence et attends la vérification par l’administrateur.',premium:'Premium : 3 USD / mois',boost:'Boost : 0,50 USD / 24 h',contact:'Déblocage contact : 1 USD',disclaimer:'Les services de paiement dépendent de la disponibilité de ton opérateur. Ne communique jamais ton code PIN Mobile Money.',sms:'Téléphone facultatif',smsHelp:'Le numéro est une information privée du profil. Il ne sert jamais à se connecter.',phone:'Téléphone facultatif',otp:'',sendCode:'',verify:'',consent:'J’ai 18 ans ou plus et j’accepte les conditions et la politique de confidentialité.',complaint:'Une question, un paiement non reconnu, un bug ou un problème de sécurité ? Écris à l’assistance.',termsBody:'Malachite est un service de rencontres réservé aux adultes de 18 ans et plus. Tu dois fournir des informations sincères, respecter les autres membres, ne pas harceler, menacer, usurper une identité, escroquer ou publier du contenu illégal. Les profils et contenus peuvent être signalés et examinés par la modération. Les fonctions payante sw:{title:'Kituo cha Malachite',intro:'Badilisha matumizi yako, soma sheria na wasiliana na usaidizi.',language:'Lugha ya tovuti',avatar:'Unda mhusika wangu',avatarHelp:'Chagua mhusika na rangi, kisha hifadhi avatar kwenye wasifu wako.',save:'Hifadhi',payments:'Malipo ya simu DRC',airtel:'Airtel Money',orange:'Orange Money',paySteps:'Hatua za malipo',legal:'Masharti na faragha',terms:'Masharti ya matumizi',privacy:'Sera ya faragha',safety:'Usalama wa miadi',support:'Malalamiko na usaidizi',category:'Aina',subject:'Mada',message:'Eleza ombi lako',send:'Tuma malalamiko',sent:'Ombi limetumwa kwa usaidizi.',noAuth:'Ingia ili kutuma malalamiko.',numbers:'Nambari za malipo zilizotolewa na mmiliki wa tovuti',manual:'Malipo ya mkono: Malachite haisomi SMS za simu yako na haihakikishi uhamisho moja kwa moja. Hifadhi kumbukumbu na subiri uthibitisho.',premium:'Premium: USD 3 / mwezi',boost:'Boost: USD 0.50 / saa 24',contact:'Kufungua mawasiliano: USD 1',disclaimer:'Usitoe PIN yako ya Mobile Money.',sms:'Usajili kwa simu',smsHelp:'Pokea msimbo wa SMS; inategemea usanidi wa mtoa SMS katika Supabase Auth.',phone:'Nambari ya kimataifa',otp:'Msimbo wa SMS',sendCode:'Tuma msimbo',verify:'Thibitisha na fungua akaunti',consent:'Nina miaka 18 au zaidi na nakubali masharti na sera ya faragha.',complaint:'Swali, malipo yasiyotambuliwa, hitilafu au tatizo la usalama? Wasiliana na usaidizi.',termsBody:'Malachite ni huduma ya mahusiano kwa watu wenye miaka 18 na zaidi. Heshimu wanachama wengine; usinyanyase, kutishia, kujifanya mtu mwingine au kufanya ulaghai. Ripoti na zuia tabia isiyofaa. Malipo yanathibitishwa kabla ya huduma kulipiwa kuwashwa. Kutana mahali pa wazi na mjulishe mtu unayemwamini.',privacyBody:'Malachite hutumia data inayohitajika kwa akaunti, wasifu, ujumbe, usalama, usaidizi na malipo. Data ya faragha haionyeshwi hadharani. Picha na media za faragha huhifadhiwa kwa ruhusa maalum. Unaweza kuwasiliana na usaidizi kuhusu data yako.',safetyBody:'Kutana mahali pa wazi, mjulishe rafiki, usitoe PIN, nywila au hati zako. Ripoti na zuia akaunti zinazotia wasiwasi.',pending:'Masharti haya yanahitaji ukaguzi wa kisheria kabla ya matumizi ya kibiashara.'},

e tala na juriste na ntwala ya kusadila mu mumbongo.'},

function mt(k){return (MAL_TEXT[malLang]&&MAL_TEXT[malLang][k])||MAL_TEXT.fr[k]||k}
function malCentre(){return '<h2>🌸 '+mt('title')+'</h2><p class="note">'+mt('intro')+'</p>'+
'<div class="mal-panel"><label>'+mt('language')+'<select id="malLang" onchange="malSetLang(this.value)"><option value="fr">Français</option><option value="sw">Kiswahili</option><option value="ln">Lingála</option><option value="kg">Kikongo</option><option value="tsh">Tshiluba</option></select></label></div>'+
'<div class="mal-panel"><h3>🎭 '+mt('avatar')+'</h3><p class="note">'+mt('avatarHelp')+'</p><div class="mal-grid"><div class="mal-tile"><div class="mal-emoji" id="malAvatarPreview" style="background:'+malAvatarColor+';border-radius:18px;text-align:center;padding:12px">'+malAvatarEmoji+'</div></div><div class="mal-tile"><label>Personnage<select id="malEmoji" onchange="malAvatarEmoji=this.value;malAvatarPreview()"><option>🥰</option><option>😎</option><option>😊</option><option>🤗</option><option>🦊</option><option>🐼</option><option>🐻</option><option>🐱</option><option>🦄</option><option>🐸</option><option>🐨</option><option>🐰</option></select></label><label>Couleur<input id="malColor" type="color" value="'+malAvatarColor+'" onchange="malAvatarColor=this.value;malAvatarPreview()"></label></div></div><button class="b1" onclick="malSaveAvatar()">'+mt('save')+'</button><div class="note" id="malAvMsg"></div></div>'+
'<div class="mal-panel"><h3>💸 '+mt('payments')+'</h3><p class="note">'+mt('numbers')+'</p><div class="mal-grid"><div class="mal-provider"><strong>🔴 '+mt('airtel')+'</strong><p><b>+243 993 315 532</b></p><button onclick="malCopy(this.dataset.num)" data-num="+243993315532">Copier le numéro</button></div><div class="mal-provider"><strong>🟠 '+mt('orange')+'</strong><p><b>+243 848 775 992</b></p><button onclick="malCopy(this.dataset.num)" data-num="+243848775992">Copier le numéro</button></div></div><h3>'+mt('paySteps')+'</h3><ol><li>Ouvre le menu Mobile Money de ton opérateur.</li><li>Envoie exactement le montant de l’offre au numéro affiché.</li><li>Garde la référence SMS de la transaction.</li><li>Dans l’onglet Offres, choisis l’opérateur, saisis la référence et envoie la demande.</li><li>L’administrateur vérifie le portefeuille et accepte ou rejette la demande.</li></ol><p class="note">'+mt('manual')+'</p><p class="note">'+mt('disclaimer')+'</p><p>'+mt('premium')+' · '+mt('boost')+' · '+mt('contact')+'</p></div>'+
'<div class="mal-panel"><h3>📜 '+mt('legal')+'</h3><h4>'+mt('terms')+'</h4><div class="mal-legal">'+mt('termsBody')+'</div><h4>'+mt('privacy')+'</h4><div class="mal-legal">'+mt('privacyBody')+'</div><h4>'+mt('safety')+'</h4><div class="mal-legal">'+mt('safetyBody')+'</div><p class="note">'+mt('pending')+'</p></div>'+
'<div class="mal-panel"><h3>🛟 '+mt('support')+'</h3><p class="note">'+mt('complaint')+'</p><div class="list"><label>'+mt('category')+'<select id="malCat"><option value="compte">Compte / connexion</option><option value="paiement">Paiement Mobile Money</option><option value="securite">Sécurité / harcèlement</option><option value="bug">Erreur technique</option><option value="autre">Autre</option></select></label><label>'+mt('subject')+'<input id="malSubject" maxlength="120" placeholder="Ex. paiement en attente"></label><label>'+mt('message')+'<textarea id="malMessage" rows="4" maxlength="2000"></textarea></label><button class="b1" onclick="malSendSupport()">'+mt('send')+'</button><div id="malSupportMsg" class="note"></div></div></div>'+
'<div class="mal-panel"><h3>🔐 Compte et sécurité</h3><p class="note">Malachite est réservé aux personnes de 18 ans et plus. Utilise un mot de passe unique, bloque les comptes suspects et signale tout abus.</p><button onclick="go(\'offres\')">Voir les abonnements</button> <button onclick="go(\'me\')">Mon profil</button></div>'}
function centre(){return malCentre()}
function malSetLang(l){malLang=MAL_TEXT[l]?l:'fr';localStorage.setItem('malachite_lang',malLang);draw(true)}
function malAvatarPreview(){var e=$('malAvatarPreview');if(e){e.textContent=malAvatarEmoji;e.style.background=malAvatarColor}}
function malCopy(v){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(function(){alert('Numéro copié.')}).catch(function(){prompt('Copie ce numéro',v)})}else prompt('Copie ce numéro',v)}
async function malSaveAvatar(){if(!me){$('malAvMsg').textContent='Connecte-toi.';return}var a={emoji:malAvatarEmoji,color:malAvatarColor};var r=await sb.from('profiles').update({avatar:a}).eq('id',me.id);if(r.error){$('malAvMsg').textContent='Avatar non enregistré : '+r.error.message;return}if(mine)mine.avatar=a;$('malAvMsg').textContent='Avatar enregistré sur ton profil.';draw(true)}
async function malSendSupport(){if(!me){$('malSupportMsg').textContent=mt('noAuth');return}var subject=$('malSubject').value.trim(),message=$('malMessage').value.trim(),category=$('malCat').value;if(subject.length<3||message.length<10){$('malSupportMsg').textContent='Objet de 3 caractères minimum et message de 10 caractères minimum.';return}if(malSupportBusy)return;malSupportBusy=true;var r=await sb.from('demandes_support').insert({categorie:category,sujet:subject,message:message});malSupportBusy=false;$('malSupportMsg').textContent=r.error?'Envoi impossible : '+r.error.message:mt('sent');if(!r.error){$('malSubject').value='';$('malMessage').value=''}}
function av(p){var a=p&&p.avatar;if(a&&a.emoji){return '<div class="av" style="background:'+esc(a.color||'#F7B7D0')+';display:grid;place-items:center;font-size:30px">'+esc(a.emoji)+'</div>'}var u=p&&p.photoUrls&&p.photoUrls[0],s=u?'background-image:url('+esc(u)+')':'';return '<div class="av" style="'+s+'">'+(s?'':esc(p&&p.prenom?p.prenom[0]:'?'))+'</div>'}
function offres(){return '<h2>⭐ Nos offres</h2><div class="list"><div class="plan"><h3>Gratuit <span>0 $</span></h3><p>Profil, découverte, likes, conversations existantes sans limite et jusqu’à 15 nouvelles conversations initiées par jour. 1 rendez-vous par semaine.</p></div><div class="plan"><h3>Premium <span>3 $ / mois</span></h3><p>Nouvelles conversations sans quota et rendez-vous illimités.</p></div><div class="plan"><h3>Boost 24 h <span>0,50 $</span></h3><p>Visibilité prioritaire pendant 24 heures.</p></div></div><div class="box list"><h3>💳 Paiement Airtel Money ou Orange Money</h3><label>Offre<select id="of"><option value="Premium">Premium — 3 USD</option><option value="Boost">Boost — 0,50 USD</option></select></label><label>Opérateur<select id="malOperator"><option value="airtel">Airtel Money — +243 993 315 532</option><option value="orange">Orange Money — +243 848 775 992</option></select></label><label>Référence de transaction<input id="cd" maxlength="120" placeholder="Référence exacte du SMS"></label><p class="note">Airtel : +243 993 315 532 · Orange : +243 848 775 992. Envoie d’abord le montant à ce numéro, puis soumets la référence. Activation après vérification manuelle.</p><button class="b1" onclick="pay()">Soumettre la demande de paiement</button><div class="note" id="pm">'+esc(msg)+'</div></div><p class="note">Les paiements sont contrôlés manuellement. Aucun code PIN ni OTP Mobile Money ne doit être communiqué à Malachite.</p>'}
async function pay(){var c=$('cd').value.trim(),operator=$('malOperator').value;if(c.length<5||c.length>120){$('pm').textContent='Saisis une référence valide (5 à 120 caractères).';return}var r=await sb.from('paiements').insert({offre:$('of').value,code:c,operateur:operator});$('pm').textContent=r.error?'Paiement non enregistré : '+r.error.message:'Demande reçue. Aucun avantage ne sera activé avant vérification réelle du portefeuille.';if(!r.error)$('cd').value=''}
async function payC(){var c=$('uc').value.trim(),operator=$('malContactOperator')?$('malContactOperator').value:'airtel';if(c.length<5){$('um').textContent='Référence de transaction requise.';return}var r=await sb.from('paiements').insert({offre:'Contact',cible:open,code:c,operateur:operator});$('um').textContent=r.error?'Erreur : '+r.error.message:'Référence reçue. Le contact sera débloqué après vérification manuelle.'}
async function loadAdm(){var r=await sb.from('paiements').select('*').eq('statut','attente').order('created_at');adm=r.data||[];var s=await sb.from('signalements').select('*').order('created_at',{ascending:false}).limit(100);sigs=s.error?[]:(s.data||[]);var z=await sb.from('suspensions').select('user_id,depuis,motif').order('depuis',{ascending:false});admSuspensions=z.error?[]:(z.data||[]);var v=await sb.from('avis_site').select('*').order('created_at',{ascending:false}).limit(50);avs=v.data||[];var q=await sb.from('demandes_support').select('*').order('created_at',{ascending:false}).limit(100);malSupportRows=q.error?[]:(q.data||[]);draw()}
var malSupportRows=[];
function supportAdmin(){return '<h2>🛟 Réclamations et assistance</h2><div class="list">'+(malSupportRows.length?malSupportRows.map(function(x){return '<div class="card"><b>'+esc(x.sujet)+'</b><div class="sub">'+esc(x.categorie)+' · '+esc(x.statut)+' · '+new Date(x.created_at).toLocaleString('fr-FR')+'</div><p>'+esc(x.message)+'</p><label>Réponse administrative<textarea id="malReply'+x.id+'" maxlength="1000">'+esc(x.reponse_admin||'')+'</textarea></label><select id="malStatus'+x.id+'"><option value="en_cours">En cours</option><option value="resolu">Résolu</option><option value="rejete">Rejeté</option></select><button onclick="malResolveSupport('+x.id+')">Enregistrer le traitement</button></div>'}).join(''):'<p class="note">Aucune demande.</p>')+'</div>'}
