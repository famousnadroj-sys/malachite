async function pay(){var c=$('cd').value.trim();if(c.length<5||c.length>120){msg='Saisis une référence valide (5 à 120 caractères).';return draw()}var r=await sb.from('paiements').insert({offre:$('of').value,code:c});msg=r.error?'Paiement non enregistré : '+r.error.message:'Référence reçue. Aucun avantage ne sera activé avant vérification réelle dans le portefeuille destinataire.';draw()}

return '<h2>Mon profil</h2>'+blockedPanel()+meter()+'<div class="box list"><div style="text-align:center">'+'<div class="av" style="width:110px;height:110px;margin:0 auto 10px;font-size:40px;'+(phUrls[0]?'background-image:url('+esc(phUrls[0])+')':'')+'">'+(phUrls[0]?'':'📷')+'</div>'+'<label class="btn b1" style="position:relative;overflow:hidden">📷 '+(ph.length?'Ajouter une autre photo':'Ajouter ma photo de profil')+'<input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%;height:100%" onchange="up(this)"></label><div class="ph" style="justify-content:center;margin-top:8px">'+phUrls.map(function(u,i){return '<div><img alt="" src="'+esc(u)+'"><br><button style="padding:3px 8px;font-size:12px" onclick="rm('+i+')">Retirer</button></div>'}).join('')+'</div><div class="note" style="color:var(--pink)">'+esc(msg)+'</div></div><label>Prénom<input id="pn" value="'+esc(m.prenom)+'"></label><div class="g2"><label>Âge<input id="pa" type="number" inputmode="numeric" value="'+esc(m.age)+'"></label><label>Profession<input id="pj" value="'+esc(m.profession)+'"></label></div><div class="g2"><label>Je suis<select id="pg"><option value="H"'+(m.genre=='H'?' selected':'')+'>Un homme</option><option value="F"'+(m.genre=='F'?' selected':'')+'>Une femme</option></select></label><label>Commune<select id="pc">'+o(['Lubumbashi','Kampemba','Katuba','Kenya','Rwashi','Annexe','Autre'],m.commune)+'</select></label></div><label>Centres d’intérêt (sépare par des virgules)<input id="pi" value="'+esc((m.interets||[]).filter(function(x){return x.indexOf('🗣')<0}).join(', '))+'"></label><div><b style="font-size:14px">Langues parlées</b><div style="margin-top:4px">'+['Français','Swahili','Lingala','Kikongo','Tshiluba','Anglais'].map(function(l){return '<label class="lg"><input type="checkbox" class="lgc" value="'+l+'"'+((m.interets||[]).indexOf('🗣 '+l)>-1?' checked':'')+'> '+l+'</label>'}).join('')+'</div></div><label>Ma biographie<textarea id="pb" rows="4" maxlength="300 async function up(el){var f=el.files[0];if(!f)return;if(ph.length>=3){msg='3 photos maximum.';return draw()}if(['image/jpeg','image/png','image/webp','image/gif'].indexOf(f.type)<0||f.size>5e6){msg='Choisis une image JPEG, PNG, WebP ou GIF de 5 Mo maximum.';return draw()}var ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[f.type],p=me.id+'/'+Date.now()+'.'+ext;var r=await sb.storage.from('profile-photos').upload(p,f,{contentType:f.type,upsert:false});if(r.error){msg='Photo non envoyée : '+r.error.message;return draw()}var u=await signedUrl('profile-photos',p);if(!u){await sb.storage.from('profile-photos').remove([p]);msg='Impossible de sécuriser l’accès à cette photo.';return draw()}ph.push(p);phUrls.push(u);if(mine){var q=await sb.from('profiles').update({photos:ph}).eq('id',me.id);if(q.error){ph.pop();phUrls.pop();await sb.storage.from('profile-photos').remove([p]);msg='Photo non enregistrée : '+q.error.message;return draw()}}msg='Photo ajoutée ✔';draw()}
