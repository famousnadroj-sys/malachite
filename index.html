<script id="malachite-stability-guard">
(function(){
  "use strict";
  var recovered=false,timer=null;
  function startupIsStuck(){
    var root=document.getElementById("v");
    return !!(root&&root.querySelector(".mal-startup, .mal-startup-screen"));
  }
  function showRecovery(message){
    if(recovered||!startupIsStuck())return;
    recovered=true;
    var root=document.getElementById("v");
    if(!root)return;
    var panel=document.createElement("section");
    panel.setAttribute("role","alert");
    panel.style.cssText="max-width:520px;margin:12vh auto;padding:26px 20px;text-align:center;font:15px/1.55 system-ui;color:#3A1224;background:#fff;border:1px solid #F3CCDA;border-radius:20px";

    var text=document.createElement("p");text.textContent=message||"Le démarrage est bloqué. Vérifie ta connexion puis réessaie.";text.style.color="#7A5566";
    var retry=document.createElement("button");retry.type="button";retry.textContent="Réessayer";retry.style.cssText="background:#E6195E;color:white;border:0;border-radius:12px;padding:13px 22px;font:700 15px system-ui";
    retry.addEventListener("click",function(){window.location.reload()});
    root.replaceChildren(title,text,retry);
    var nav=document.getElementById("nav");if(nav)nav.replaceChildren();
  }
  window.malShowStartupRecovery=showRecovery;
  timer=window.setTimeout(function(){if(startupIsStuck())showRecovery("Le démarrage prend trop de temps. Vérifie Internet puis appuie sur Réessayer.");},22000);
  window.addEventListener("pageshow",function(){if(!startupIsStuck()&&timer)clearTimeout(timer)});
})();
</script>

<script id="malachite-dependency-loader">
(function(){
  "use strict";
  var coreStarted=false,attemptStarted=false;
  var cdns=[
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js",
    "https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
  ];
  function startCore(){
    if(coreStarted)return;coreStarted=true;
    var core=document.createElement("script");core.src="./app-core.js";
    core.onerror=function(){if(window.malShowStartupRecovery)window.malShowStartupRecovery("Le fichier principal de MALACHITE n’a pas pu être chargé. Réessaie après avoir vérifié ta connexion.");};
    document.head.appendChild(core);
  }
  function loadLibrary(index){
    if(attemptStarted)return;attemptStarted=true;
    var script=document.createElement("script"),finished=false;
    function fallback(){if(finished)return;finished=true;script.onload=script.onerror=null;if(index+1<cdns.length){attemptStarted=false;loadLibrary(index+1)}else if(window.malShowStartupRecovery){window.malShowStartupRecovery("La bibliothèque de connexion n’a pas pu être téléchargée depuis les serveurs disponibles. Vérifie Internet puis réessaie.");}}
    script.src=cdns[index];
    script.onload=function(){if(finished)return;if(window.supabase&&typeof window.supabase.createClient==="function"){finished=true;startCore();}else fallback();};
    script.onerror=fallback;
    document.head.appendChild(script);
    window.setTimeout(fallback,8500);
  }
  loadLibrary(0);
})();
</script>
