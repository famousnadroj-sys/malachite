<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Malachite – Rencontres à Lubumbashi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:light;--bg:#fff;--ink:#3A1224;--muted:#7A5566;--line:#F3CCDA;--pink:#E6195E;--pink2:#FF4F8B;--soft:#FFE3EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{background:linear-gradient(135deg,#E6195E,#FF4F8B);color:#fff;padding:16px 20px 20px;border-radius:0 0 26px 26px}
.brand{font-weight:800;font-size:22px}header h1{margin:8px 0 0;font-size:26px;line-height:1.15}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h2{font-size:20px;margin:20px 0 10px}
.card,.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
.card{display:grid;gap:8px}.list{display:grid;gap:12px}.top{display:flex;gap:12px;align-items:center}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;flex:none;background:linear-gradient(135deg,#E6195E,#FF8FB8) center/cover}
.nm{font-weight:800;font-size:18px}.sub,.note{color:var(--muted);font-size:14px}
.chip{background:var(--soft);border-radius:99px;padding:3px 10px;font-size:13px;margin-right:4px;display:inline-block}
.tag{background:var(--pink);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-left:6px}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph img{width:72px;height:72px;object-fit:cover;border-radius:12px}
.acts{display:flex;gap:8px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 14px;cursor:pointer;background:var(--soft);color:var(--ink);text-align:center}
.b1{background:var(--pink);color:#fff;flex:1}.acts button{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:5px;font-weight:600;font-size:14px}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--muted);display:grid;gap:2px;justify-items:center;font-size:11px;padding:6px 1px}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--pink);background:var(--soft)}
.chat{display:grid;gap:8px;margin:12px 0}.m{max-width:80%;padding:9px 13px;border-radius:16px;font-size:15px}
.in{background:#fff;border:1px solid var(--line);justify-self:start}.out{background:var(--pink);color:#fff;justify-self:end}
.send{display:flex;gap:8px}.send button{background:var(--pink);color:#fff}
.wall{border:2px solid var(--pink);border-radius:16px;padding:14px;margin-top:10px}
.plan{border:1px solid var(--line);border-radius:16px;padding:12px 14px}.plan h3{margin:0;display:flex;justify-content:space-between;font-size:17px}.plan p{margin:4px 0 0;color:var(--muted);font-size:14px}
.err{color:#B00020;font-size:14px}
</style>
</head>
<body>
<header><div class="brand">Malachite 💗</div><h1>Ici, on se rencontre pour de vrai.</h1></header>
<main id="v"></main><nav id="nav"></nav>
<script>
var sb=supabase.createClient('https://tscsmemsvgacqioncash.supabase.co','sb_publishable_XDpqSzsPNeVduv6aGyjuoA_suakeFN0');
var me=null,mine=null,NUM='',rdvs=[],pos='',priv={},profs=[],st={},tab='home',open=null,msgs=[],convs=[],ph=[],msg='',F={g:'',c:'',a:18,b:99},timer,mode='in';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function on(t){return t&&new Date(t)>new Date()}
function av(p){var s=p&&p.photos&&p.photos[0]?'background-image:url('+p.photos[0]+')':'';return '<div class="av" style="'+s+'">'+(s?'':esc(p&&p.prenom?p.prenom[0]:'?'))+'</div>'}
function card(p){var s=st[p.id]||{};return '<div class="card"><div class="top">'+av(p)+'<div><div class="nm">'+esc(p.prenom)+', '+p.age+(on(s.verified_until)?'<span class="tag">✔ Vérifié</span>':'')+'</div><div class="sub">'+esc(p.commune)+(p.profession?' · '+esc(p.profession):'')+'</div></div></div>'+(p.photos&&p.photos.length>1?'<div class="ph">'+p.photos.map(function(u){return '<img alt="" src="'+esc(u)+'">'}).join('')+'</div>':'')+'<p style="margin:0">'+esc(p.bio)+'</p><div>'+(p.interets||[]).map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div><div class="acts"><button class="b1" onclick="talk(\''+p.id+'\')">Écrire</button><button onclick="rep(\''+p.id+'\')">Signaler</button></div></div>'}
async function rep(id){await sb.from('signalements').insert({profil:id,motif:'signalé'});alert('Merci, le profil a été signalé.')}
function others(){return profs.filter(function(p){return p.id!=me.id}).sort(function(a,b){return (on((st[b.id]||{}).boost_until)?1:0)-(on((st[a.id]||{}).boost_until)?1:0)})}
async function load(){var r=await sb.from('profiles').select('*');profs=r.data||[];var s=await sb.from('statuts').select('*');st={};(s.data||[]).forEach(function(x){st[x.user_id]=x});mine=profs.filter(function(p){return p.id==me.id})[0]||null;if(mine&&!ph.length)ph=mine.photos||[];var q=await sb.from('prives').select('*').eq('id',me.id).maybeSingle();priv=q.data||{};var c=await sb.from('config').select('valeur').eq('cle','airtel').maybeSingle();NUM=c.data?c.data.valeur:'';await loadRdv()}
function authView(){return '<h2>'+(mode=='in'?'Connexion':'Créer mon compte')+'</h2><div class="box list"><label>E-mail<input id="em" type="email" autocomplete="email"></label><label>Mot de passe (6 caractères minimum)<input id="pw" type="password" autocomplete="'+(mode=='in'?'current-password':'new-password')+'"></label><button class="b1" onclick="auth()">'+(mode=='in'?'Me connecter':'Créer mon compte')+'</button><div class="err" id="ae">'+esc(msg)+'</div><button onclick="mode=mode==\'in\'?\'up\':\'in\';msg=\'\';draw()">'+(mode=='in'?'Pas encore de compte ? Inscris-toi':'J’ai déjà un compte')+'</button></div><p class="note">Réservé aux personnes de 18 ans et plus.</p>'}
async function auth(){var e=$('em').value.trim(),p=$('pw').value;msg='';var r=mode=='in'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});if(r.error){msg=r.error.message;$('ae').textContent=msg}else if(!r.data.session){msg='Compte créé. Connecte-toi.';mode='in';draw()}}
async function out(){await sb.auth.signOut()}
function home(){var o=others();return (mine?'':'<div class="wall"><b>Crée ton profil</b><p class="note">Ajoute ta photo, ta bio et tes infos pour que les autres te voient.</p><button class="b1" style="width:100%" onclick="go(\'me\')">📷 Créer mon profil</button></div>')+'<h2>Profils ('+o.length+')</h2><div class="list">'+(o.length?o.map(card).join(''):'<p class="note">Aucun autre membre pour l’instant. Invite tes amis !</p>')+'</div>'}
function search(){return '<h2>Recherche</h2><div class="box g2"><select id="fg" onchange="fl()"><option value="">Tous</option><option value="F">Femmes</option><option value="H">Hommes</option></select><select id="fc" onchange="fl()"><option value="">Toutes communes</option><option>Lubumbashi</option><option>Kampemba</option><option>Katuba</option><option>Kenya</option><option>Rwashi</option><option>Annexe</option><option>Autre</option></select><input id="fa" type="number" inputmode="numeric" value="'+F.a+'" oninput="fl()" aria-label="Âge min"><input id="fb" type="number" inputmode="numeric" value="'+F.b+'" oninput="fl()" aria-label="Âge max"></div><div class="list" id="res" style="margin-top:12px"></div>'}
function fl(){F.g=$('fg').value;F.c=$('fc').value;F.a=+$('fa').value||18;F.b=+$('fb').value||99;res()}
function res(){var r=others().filter(function(p){return(!F.g||p.genre==F.g)&&(!F.c||p.commune==F.c)&&p.age>=F.a&&p.age<=F.b});$('res').innerHTML=r.length?r.map(card).join(''):'<p class="note">Aucun profil trouvé.</p>'}
function prof(id){return profs.filter(function(p){return p.id==id})[0]}
async function loadChat(){if(open){var r=await sb.from('messages').select('*').or('and(de.eq.'+me.id+',a.eq.'+open+'),and(de.eq.'+open+',a.eq.'+me.id+')').order('created_at');msgs=r.data||[]}else{var c=await sb.from('messages').select('de,a,texte,created_at').order('created_at',{ascending:false}).limit(200);var seen={};convs=[];(c.data||[]).forEach(function(m){var o=m.de==me.id?m.a:m.de;if(!seen[o]){seen[o]=1;convs.push({o:o,t:m.texte})}})}
if(tab=='chat')draw(true)}
function chat(){if(open){var p=prof(open)||{};return '<button onclick="open=null;loadChat()">← Retour</button><div class="top" style="margin-top:12px">'+av(p)+'<div class="nm">'+esc(p.prenom||'Membre')+'</div></div><div class="chat">'+msgs.map(function(m){return '<div class="m '+(m.de==me.id?'out':'in')+'">'+esc(m.texte)+'</div>'}).join('')+'</div><div class="send"><input id="mi" placeholder="Écris ton message…" aria-label="Message" onkeydown="if(event.key==\'Enter\')snd()"><button onclick="snd()">Envoyer</button></div><div class="err" id="me2">'+esc(msg)+'</div>'}
return '<h2>Conversations</h2><div class="list">'+(convs.length?convs.map(function(c){var p=prof(c.o)||{};return '<button class="card" style="text-align:left;font-weight:400" onclick="open=\''+c.o+'\';loadChat()"><div class="top">'+av(p)+'<div><div class="nm">'+esc(p.prenom||'Membre')+'</div><div class="sub">'+esc(c.t).slice(0,60)+'</div></div></div></button>'}).join(''):'<p class="note">Aucune conversation. Appuie sur « Écrire » sur un profil.</p>')+'</div>'}
async function snd(){var t=$('mi').value.trim();if(!t)return;var r=await sb.from('messages').insert({a:open,texte:t});if(r.error){msg=/limite_gratuite/.test(r.error.message)?'Limite de 5 messages par jour atteinte. Passe en Premium (onglet Offres).':/contact_interdit/.test(r.error.message)?'Les numéros de téléphone et les réseaux sociaux sont réservés aux membres Premium.':'Message non envoyé.';$('me2').textContent=msg}else{msg='';loadChat()}}
function talk(id){open=id;go('chat')}
var ST={attente:'En attente',confirme:'Confirmé ✔',refuse:'Refusé'};
async function loadRdv(){var r=await sb.from('rendez_vous').select('*').order('quand');rdvs=r.data||[]}
function rdv(){var o=others();return '<h2>Mes rendez-vous</h2><div class="list">'+(rdvs.length?rdvs.map(function(x){var p=prof(x.de==me.id?x.a:x.de)||{},d=new Date(x.quand).toLocaleString('fr-FR',{dateStyle:'full',timeStyle:'short'});return '<div class="card"><div class="top">'+av(p)+'<div><div class="nm">'+esc(p.prenom||'Membre')+'</div><div class="sub">'+(x.de==me.id?'Tu as invité':'Invitation reçue')+' · '+ST[x.statut]+'</div></div></div><div>📅 '+esc(d)+'</div><div>📍 '+esc(x.lieu)+(/^https:\/\/maps\.google\.com\//.test(x.lien_carte||'')?' · <a href="'+esc(x.lien_carte)+'" target="_blank" rel="noopener">Voir sur la carte</a>':'')+'</div>'+(x.message?'<div class="note">'+esc(x.message)+'</div>':'')+(x.a==me.id&&x.statut=='attente'?'<div class="acts"><button class="b1" onclick="repRdv('+x.id+',\'confirme\')">Confirmer</button><button onclick="repRdv('+x.id+',\'refuse\')">Refuser</button></div>':'')+'</div>'}).join(''):'<p class="note">Aucun rendez-vous.</p>')+'</div><h2>Créer un rendez-vous</h2><div class="box list"><p class="note" style="margin:0">Pour une première rencontre, choisis toujours un lieu public (restaurant, café).</p><label>Avec qui ?<select id="ra">'+o.map(function(p){return '<option value="'+p.id+'">'+esc(p.prenom)+'</option>'}).join('')+'</select></label><label>Date et heure<input id="rd" type="datetime-local"></label><label>Lieu (nom et quartier)<input id="rl" placeholder="Ex. Café du Centre, Lubumbashi"></label><label>Message<textarea id="rm" rows="2" maxlength="300"></textarea></label><button onclick="gps()">📍 Ajouter ma position</button><div class="note" style="color:var(--pink)" id="gp">'+esc(msg)+'</div><button class="b1" onclick="mkRdv()">Envoyer l’invitation</button></div>'}
function gps(){navigator.geolocation.getCurrentPosition(function(p){pos='https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude;$('gp').textContent='Position ajoutée ✔'},function(){$('gp').textContent='Position refusée.'})}
async function mkRdv(){var a=$('ra').value,q=$('rd').value,l=$('rl').value.trim();if(!a||!q||!l){msg='Choisis la personne, la date et le lieu.';return draw()}var r=await sb.from('rendez_vous').insert({a:a,quand:new Date(q).toISOString(),lieu:l,message:$('rm').value.trim(),lien_carte:pos||null});msg=r.error?(/limite_rdv/.test(r.error.message)?'Les membres gratuits ont 1 rendez-vous par semaine. Passe en Premium (onglet Offres).':'Rendez-vous non créé.'):'Invitation envoyée ✔';pos='';await loadRdv();draw()}
async function repRdv(id,s){await sb.from('rendez_vous').update({statut:s}).eq('id',id);await loadRdv();draw()}
function offres(){return '<h2>Nos offres</h2><div class="list"><div class="plan"><h3>Gratuit <span>0 $</span></h3><p>Profil, recherche, 5 messages par jour et 1 rendez-vous par semaine.</p></div><div class="plan" style="border:2px solid var(--pink)"><h3>Premium <span>3 $ / mois</span></h3><p>Messages et rendez-vous illimités, numéros autorisés.</p></div><div class="plan"><h3>Boost 24 h <span>0,50 $</span></h3><p>Ton profil passe en premier.</p></div><div class="plan"><h3>Badge Vérifié <span>1 $ / 2 semaines</span></h3><p>Prouve que tu es une vraie personne.</p></div></div><h2>Payer avec Airtel Money</h2><ol><li>Envoie le montant au numéro Airtel Money : <b>'+esc(NUM||'(non disponible)')+'</b></li><li>Note le code reçu par SMS.</li><li>Choisis l’offre et écris le code ci-dessous.</li></ol><div class="box list"><select id="of"><option>Premium</option><option>Boost</option><option>Badge Vérifié</option></select><input id="cd" placeholder="Code de transaction"><button class="b1" onclick="pay()">J’ai payé</button><div class="note" id="pm">'+esc(msg)+'</div></div>'}
async function pay(){var c=$('cd').value.trim();if(!c)return;var r=await sb.from('paiements').insert({offre:$('of').value,code:c});msg=r.error?'Erreur, réessaie.':'Code reçu. Ton compte sera activé après vérification.';draw()}
function moi(){var m=mine||{};function o(a,v){return a.map(function(x){return '<option'+(x==v?' selected':'')+'>'+x+'</option>'}).join('')}
return '<h2>Mon profil</h2><div class="box list"><div style="text-align:center">'+'<div class="av" style="width:110px;height:110px;margin:0 auto 10px;font-size:40px;'+(ph[0]?'background-image:url('+esc(ph[0])+')':'')+'">'+(ph[0]?'':'📷')+'</div>'+'<label class="btn b1" style="position:relative;overflow:hidden">📷 '+(ph.length?'Ajouter une autre photo':'Ajouter ma photo de profil')+'<input type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%;height:100%" onchange="up(this)"></label><div class="ph" style="justify-content:center;margin-top:8px">'+ph.map(function(u,i){return '<div><img alt="" src="'+esc(u)+'"><br><button style="padding:3px 8px;font-size:12px" onclick="rm('+i+')">Retirer</button></div>'}).join('')+'</div><div class="note" style="color:var(--pink)">'+esc(msg)+'</div></div><label>Prénom<input id="pn" value="'+esc(m.prenom)+'"></label><div class="g2"><label>Âge<input id="pa" type="number" inputmode="numeric" value="'+esc(m.age)+'"></label><label>Profession<input id="pj" value="'+esc(m.profession)+'"></label></div><div class="g2"><label>Je suis<select id="pg"><option value="H"'+(m.genre=='H'?' selected':'')+'>Un homme</option><option value="F"'+(m.genre=='F'?' selected':'')+'>Une femme</option></select></label><label>Commune<select id="pc">'+o(['Lubumbashi','Kampemba','Katuba','Kenya','Rwashi','Annexe','Autre'],m.commune)+'</select></label></div><label>Centres d’intérêt (sépare par des virgules)<input id="pi" value="'+esc((m.interets||[]).join(', '))+'"></label><label>Ma biographie<textarea id="pb" rows="4" maxlength="300">'+esc(m.bio)+'</textarea></label><h3 style="margin:6px 0 0">Informations privées</h3><p class="note" style="margin:0">Visibles par toi seulement.</p><label>Nom complet<input id="pnm" value="'+esc(priv.nom_complet)+'"></label><label>Adresse<input id="pad" value="'+esc(priv.adresse)+'"></label><label>Téléphone<input id="ptl" type="tel" value="'+esc(priv.telephone)+'"></label><label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" id="pok" style="width:auto"> J’ai 18 ans ou plus et j’accepte les règles de respect.</label><button class="b1" onclick="save()">Enregistrer mon profil</button><button onclick="out()">Me déconnecter</button></div>'}
async function up(el){var f=el.files[0];if(!f)return;if(ph.length>=3){msg='3 photos maximum.';return draw()}if(f.size>5e6){msg='Photo trop lourde (5 Mo max).';return draw()}msg='Envoi en cours…';draw();var p=me.id+'/'+Date.now()+'.'+(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');var r=await sb.storage.from('photos').upload(p,f,{contentType:f.type});if(r.error){msg='Photo non envoyée : '+r.error.message;return draw()}ph.push(sb.storage.from('photos').getPublicUrl(p).data.publicUrl);if(mine)await sb.from('profiles').update({photos:ph}).eq('id',me.id);msg='Photo ajoutée ✔'+(mine?'':' Enregistre ton profil.');draw()}
async function rm(i){ph.splice(i,1);if(mine)await sb.from('profiles').update({photos:ph}).eq('id',me.id);draw()}
async function save(){var a=+$('pa').value;if(!$('pn').value.trim()||a<18||!$('pok').checked){msg='Prénom, âge (18 ans ou plus) et accord obligatoires.';return draw()}
var r=await sb.from('profiles').upsert({id:me.id,prenom:$('pn').value.trim(),age:a,genre:$('pg').value,commune:$('pc').value,profession:$('pj').value.trim(),bio:$('pb').value.trim(),interets:$('pi').value.split(',').map(function(s){return s.trim()}).filter(Boolean).slice(0,6),photos:ph});
var q=await sb.from('prives').upsert({id:me.id,nom_complet:$('pnm').value.trim(),adresse:$('pad').value.trim(),telephone:$('ptl').value.trim()});
msg=(r.error||q.error)?'Enregistrement impossible : '+(r.error||q.error).message:'Profil enregistré ✔';await load();draw()}
function draw(keep){var y=scrollY;$('v').innerHTML=!me?authView():{home:home,search:search,chat:chat,rdv:rdv,offres:offres,me:moi}[tab]();if(me&&tab=='search')res();$('nav').innerHTML=me?[['home','🏠','Accueil'],['search','🔍','Recherche'],['chat','💬','Messages'],['rdv','📅','Rendez-vous'],['offres','⭐','Offres'],['me','👤','Moi']].map(function(x){return '<button class="'+(tab==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join(''):'';scrollTo(0,keep?y:0)}
function go(t){tab=t;msg='';clearInterval(timer);if(t=='chat'){loadChat();timer=setInterval(loadChat,6000)}else if(t=='home'||t=='search'){load().then(draw)}else if(t=='rdv'){loadRdv().then(draw)}draw()}
sb.auth.onAuthStateChange(function(e,s){me=s?s.user:null;if(me){load().then(function(){draw()})}else draw()});
sb.auth.getSession().then(function(r){me=r.data.session?r.data.session.user:null;if(me)load().then(draw);else draw()});
</script>
</body>
</html>
