var r=await sb.from('profiles').upsert({id:me.id,prenom:$('pn').value.trim(),age:a,genre:$('pg').value,commune:$('pc').value,profession:$('pj').value.trim(),bio:$('pb').value.trim(),interets:$('pi').value.split(',').map(function(s){return s.trim()}).filter(Boolean).slice(0,6).concat([].slice.call(document.querySelectorAll('.lgc:checked')).map(function(x){return '🗣 '+x.value})),photos:ph,prompts:pqv()});
var q=await sb.from('prives').upsert({id:me.id,nom_complet:$('pnm').value.trim(),adresse:$('pad').value.trim(),telephone:$('ptl').value.trim(),prefs:priv.prefs||(mine&&mine.prefs)||{}});
msg=(r.error||q.error)?'Enregistrement impossible : '+(r.error||q.error).message:'Profil enregistré ✔';await load();draw();if(!r.error&&!q.error)hearts()}
function draw(keep){var y=scrollY,tv=$('mi')?$('mi').value:'';$('v').innerHTML=!me?authView():banner()+{home:home,search:search,chat:chat,rdv:rdv,offres:offres,me:moi,adm:admin}[tab]();if(me&&tab=='search'){fqr();res()}if(tv&&$('mi'))$('mi').value=tv;if(me&&tab=='home')bindDrag();$('nav').innerHTML=me?[['home','💘','Découvrir'],['search','🔍','Recherche'],['chat','💬','Messages'],['rdv','📅','RDV'],['offres','⭐','Offres'],['me','👤','Moi']].concat(me.email==ADM?[['adm','🛠','Admin']]:[]).map(function(x){return '<button data-k="'+x[0]+'" class="'+(tab==x[0]?'on':'')+'" onclick="goTab(\''+x[0]+'\')"><span>'+ico(x[0])+bdg(x[0])+'</span>'+x[2]+'</button>'}).join(''):'';scrollTo(0,(tab=='chat'&&open)?1e6:(keep?y:0))}
function go(t){document.querySelectorAll('.sheetbg,.viewer,.lbx').forEach(function(e){e.remove()});tab=t;msg='';lastSig='';clearInterval(timer);if(t=='chat'){loadChat();timer=setInterval(loadChat,4000)}else if(t=='home'||t=='search'){load().then(draw)}else if(t=='rdv'){loadRdv().then(draw)}else if(t=='adm'){loadAdm()}draw()}
sb.auth.onAuthStateChange(function(e,s){me=s?s.user:null;if(me){load().then(function(){draw();if(fresh){fresh=false;welcome()}})}else draw()});
sb.auth.getSession().then(function(r){me=r.data.session?r.data.session.user:null;if(me)load().then(draw);else draw()});
</script>
