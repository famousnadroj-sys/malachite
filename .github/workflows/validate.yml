name: Malachite validation
on:
  push:
    branches: [main, fix/security-hardening, 'feature/**', 'preview/**']
  pull_request:
    branches: [main, preview/malachite-match-staging-clean]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard isolated preview from production Pages auto-publish
        if: github.event_name == 'pull_request' && github.base_ref == 'preview/malachite-match-staging-clean'
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*push:' .github/workflows/deploy-production.yml; then
            echo 'Combined production Pages workflow must not auto-trigger on preview PRs.'
            exit 1
          fi
          grep -Fq 'workflow_dispatch:' .github/workflows/deploy-production.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript
        run: |
          node scripts/validate.mjs
          node --check malachite-ai.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/admin-user-moderation/index.ts
          deno check supabase/functions/malachite-ai-manager/index.ts
          deno check supabase/functions/malachite-ai-worker/index.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse SQL migrations
        run: |
          python -m pip install --disable-pip-version-check pglast
          python scripts/validate_sql.py
  match-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run Match migration and runtime tests on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/malachite_match_runtime.psql
