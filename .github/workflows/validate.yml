name: Malachite validation
on:
  push:
    branches: [main, fix/security-hardening, website/public-launch-cleanup-2026-11-24]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript
        run: |
          node scripts/validate.mjs
          node --check malachite-ai.js
          node --check scripts/smoke-deployed-site.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every Edge Function
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            deno check "$file"
          done < <(find supabase/functions -type f -name index.ts -print0 | sort -z)
      - name: Test bounded AI worker body reader
        run: deno test supabase/functions/malachite-ai-worker/body_test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse SQL migrations
        run: |
          python -m pip install --disable-pip-version-check pglast
          python scripts/validate_sql.py

  account-deletion-fk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malachite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d malachite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      - name: Apply disposable account-deletion fixture, migration and assertions
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_fk_fixture.sql
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124120000_account_deletion_fk_cleanup.sql
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_fk_checks.sql

