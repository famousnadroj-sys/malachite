  ai-worker-replay-protection:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malachite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d malachite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      - name: Apply replay verifier without rewriting the existing cron
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/ai_worker_replay_fixture.sql
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125170000_prevent_malachite_ai_worker_replay.sql
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/ai_worker_replay_checks.sql
          # URL/project-ref Vault values are optional when preserving the existing signed cron.
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -c "delete from vault.decrypted_secrets where name in ('malachite_ai_worker_url','malachite_ai_worker_project_ref')"
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125170000_prevent_malachite_ai_worker_replay.sql
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/ai_worker_replay_missing_config_checks.sql
          # If optional URL/ref values are supplied but disagree, abort and preserve the cron.
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -c "insert into vault.decrypted_secrets(name,decrypted_secret) values('malachite_ai_worker_url','https://isolatedtest.supabase.co/functions/v1/malachite-ai-worker'),('malachite_ai_worker_project_ref','anotherproject') on conflict(name) do update set decrypted_secret=excluded.decrypted_secret"
          if psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125170000_prevent_malachite_ai_worker_replay.sql >/tmp/worker-project-mismatch.log 2>&1; then cat /tmp/worker-project-mismatch.log; echo "migration unexpectedly succeeded with mismatched optional project ref"; exit 1; fi
          grep -q "worker URL/project-ref mismatch; migration aborted" /tmp/worker-project-mismatch.log
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/ai_worker_replay_project_mismatch_checks.sql
          # Missing HMAC must fail closed before replacing the active verifier or cron.
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -c "update vault.decrypted_secrets set decrypted_secret='isolatedtest' where name='malachite_ai_worker_project_ref'; delete from vault.decrypted_secrets where name='malachite_ai_worker_hmac'"
          if psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261125170000_prevent_malachite_ai_worker_replay.sql >/tmp/worker-missing-hmac.log 2>&1; then cat /tmp/worker-missing-hmac.log; echo "migration unexpectedly succeeded without worker HMAC"; exit 1; fi
          grep -q "active worker cron is not HMAC configured" /tmp/worker-missing-hmac.log
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/ai_worker_replay_legacy_missing_config_checks.sql
          # Verify the nonce verifier also installs when pg_cron/pg_net are absent.
          createdb -h localhost -U postgres malachite_no_scheduler
          psql -h localhost -U postgres -d malachite_no_scheduler -v ON_ERROR_STOP=1 -f supabase/tests/ai_worker_no_scheduler_fixture.sql
          psql -h localhost -U postgres -d malachite_no_scheduler -v ON_ERROR_STOP=1 -f supabase/migrations/20261125170000_prevent_malachite_ai_worker_replay.sql
          psql -h localhost -U postgres -d malachite_no_scheduler -v ON_ERROR_STOP=1 -f supabase/tests/ai_worker_no_scheduler_checks.sql
