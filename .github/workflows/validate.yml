  username-login-throttle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malachite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d malachite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      - name: Apply real login throttle migration and verify service-only execution
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/username_login_throttle_fixture.sql
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126210000_atomic_username_login_throttle.sql
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/username_login_throttle_checks.sql
      - name: Verify concurrent requests cannot race past the limit
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          results="$(mktemp)"
          pids=()
          for i in $(seq 1 20); do
            psql -h localhost -U postgres -d malachite_test -At -v ON_ERROR_STOP=1 \
              -c "select public.consume_username_login_attempt(repeat('c',64),60,5)" >> "$results" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          allowed="$(grep -xc 't' "$results" || true)"
          denied="$(grep -xc 'f' "$results" || true)"
          rows="$(psql -h localhost -U postgres -d malachite_test -At -v ON_ERROR_STOP=1 \
            -c "select count(*) from public.username_login_attempts where ip_hash=repeat('c',64)")"
          test "$allowed" -eq 5
          test "$denied" -eq 15
          test "$rows" -eq 5

