name: Malachite validation
on:
  push:
    branches: [main, fix/security-hardening]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript
        run: |
          node scripts/validate.mjs
          node --check malachite-ai.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: |
          deno check supabase/functions/admin-user-moderation/index.ts
          deno check supabase/functions/malachite-ai-manager/index.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse SQL migrations
        run: |
          python -m pip install --disable-pip-version-check pglast
          python scripts/validate_sql.py
