name: Malachite release integration contract

on:
  push:
    branches: [website/public-launch-cleanup-2026-11-24]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout secured application candidate
        uses: actions/checkout@v4
        with:
          ref: security/profile-write-authorization-v1
          path: app-source

      - name: Checkout public launch pages
        uses: actions/checkout@v4
        with:
          ref: website/public-launch-cleanup-2026-11-24
          path: public-source

      - name: Checkout isolated Match preview
        uses: actions/checkout@v4
        with:
          ref: preview/malachite-match-staging-clean
          path: preview-source

      - name: Assemble non-deployable release artifact
        env:
          PROD_SUPABASE_REF: tscsmemsvgacqioncash
          STAGING_SUPABASE_REF: sbawknyxcjslvhknomkd
          PROD_PUBLISHABLE_KEY: sb_publishable_XDpqSzsPNeVduv6aGyjuoA_suakeFN0
          STAGING_PUBLISHABLE_KEY: sb_publishable_rXT4ztk4NLX-PeK2spwzqg_UcKMnRD5
        run: |
          set -euo pipefail
          mkdir -p _site/icons _site/preview/icons
          cp app-source/index.html app-source/*.js app-source/*.html app-source/manifest.webmanifest app-source/sw.js app-source/.nojekyll _site/
          cp app-source/icons/malachite.svg _site/icons/
          cp public-source/index.html public-source/decouvrir.html public-source/404.html _site/
          cp public-source/robots.txt public-source/sitemap.xml _site/
          rm -f _site/partenaires.html
          cp preview-source/index.html preview-source/*.js preview-source/*.html preview-source/manifest.webmanifest preview-source/sw.js preview-source/.nojekyll _site/preview/
          cp preview-source/icons/malachite.svg _site/preview/icons/
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path("_site/preview")
          replacements = {
              os.environ["PROD_SUPABASE_REF"]: os.environ["STAGING_SUPABASE_REF"],
              os.environ["PROD_PUBLISHABLE_KEY"]: os.environ["STAGING_PUBLISHABLE_KEY"],
          }
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for old, new in replacements.items():
                  content = content.replace(old, new)
              path.write_text(content, encoding="utf-8")
          PY
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/decouvrir.html
          test -f _site/icons/malachite.svg
          test -f _site/preview/index.html
          test -f _site/preview/icons/malachite.svg

      - name: Smoke-test the assembled artifact without publishing
        working-directory: public-source
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE/_site" >/tmp/malachite-release-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then
              break
            fi
            sleep 1
          done
          SITE_URL=http://127.0.0.1:8765/ node scripts/smoke-deployed-site.mjs
