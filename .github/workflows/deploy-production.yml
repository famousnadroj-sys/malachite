name: MALACHITE Match preview source validation
on:
  push:
    branches:
      - preview/malachite-match-staging-clean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Match source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Match application
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          grep -Fq 'function matchPage()' app-core.js
          grep -Fq 'match:matchPage' app-core.js
          grep -Fq "['match','💗','Match']" app-core.js
          grep -Fq "t=='home'||t=='search'||t=='match'" app-core.js
          echo "Dedicated Match screen and route checks passed."
