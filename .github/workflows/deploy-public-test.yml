name: MALACHITE isolated Match preview validation
on:
  push:
    branches:
      - preview/malachite-match-staging-clean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate preview application JavaScript
        run: node scripts/validate.mjs
      - name: Verify Match frontend is present
        run: |
          set -euo pipefail
          grep -Fq 'function matchExperience' app-core.js
          grep -Fq 'async function loadMatchData' app-core.js
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          echo "Match frontend source validation passed."
