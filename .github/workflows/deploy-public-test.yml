name: Malachite public test deployment
on:
  push:
    branches:
      - work/ai-manager-payment-ux-2026-11-20
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: malachite-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete test branch
        uses: actions/checkout@v4
        with:
          ref: work/ai-manager-payment-ux-2026-11-20
      - name: Validate application JavaScript
        run: |
          node --version
          node scripts/validate.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish public test site
        id: deployment
        uses: actions/deploy-pages@v4
