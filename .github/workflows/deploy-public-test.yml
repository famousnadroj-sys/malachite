name: MALACHITE isolated preview validation
on:
  push:
    branches:
      - preview/malachite-match-staging-clean
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/malachite-match-staging-clean
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application JavaScript
        run: node scripts/validate.mjs
      - name: Build isolated staging artifact without publishing it
        env:
          PROD_SUPABASE_REF: tscsmemsvgacqioncash
          STAGING_SUPABASE_REF: sbawknyxcjslvhknomkd
          PROD_PUBLISHABLE_KEY: sb_publishable_XDpqSzsPNeVduv6aGyjuoA_suakeFN0
          STAGING_PUBLISHABLE_KEY: sb_publishable_rXT4ztk4NLX-PeK2spwzqg_UcKMnRD5
        run: |
          set -euo pipefail
          mkdir -p _site/icons
          cp index.html *.js *.html manifest.webmanifest sw.js .nojekyll _site/
          cp icons/malachite.svg _site/icons/
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path("_site")
          replacements = {
              os.environ["PROD_SUPABASE_REF"]: os.environ["STAGING_SUPABASE_REF"],
              os.environ["PROD_PUBLISHABLE_KEY"]: os.environ["STAGING_PUBLISHABLE_KEY"],
          }
          counts = {old: 0 for old in replacements}
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for old, new in replacements.items():
                  counts[old] += content.count(old)
                  content = content.replace(old, new)
              path.write_text(content, encoding="utf-8")
          if not all(counts.values()):
              raise SystemExit("Preview validation failed: production config was not fully replaced.")
          for path in root.rglob("*"):
              if path.is_file():
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if any(old in content for old in replacements):
                      raise SystemExit(f"Production config remains in preview artifact: {path}")
          html = (root / "index.html").read_text(encoding="utf-8")
          banner = '<div id="mal-staging-banner" role="status">MALACHITE · ENVIRONNEMENT DE TEST · DONNÉES DE TEST UNIQUEMENT</div>'
          style = '<style>#mal-staging-banner{position:sticky;top:0;z-index:99999;background:#7c2d12;color:#fff;text-align:center;padding:8px 12px;font:700 12px system-ui;letter-spacing:.04em}</style>'
          if 'id="mal-staging-banner"' not in html:
              html = html.replace("</head>", style + "</head>", 1)
              import re
              html, count = re.subn(r"(<body\\b[^>]*>)", lambda match: match.group(1) + banner, html, count=1, flags=re.I)
              if count != 1:
                  raise SystemExit("Preview validation failed: body element not found.")
          (root / "index.html").write_text(html, encoding="utf-8")
          PY
          test -f _site/index.html
          test -f _site/app-core.js
          test -f _site/icons/malachite.svg
          echo "Isolated preview artifact built and validated. It is not published."
