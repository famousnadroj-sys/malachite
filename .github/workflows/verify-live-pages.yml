name: MALACHITE live Pages verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for this commit's GitHub Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")
            result=$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .head_sha == $sha) | [.status, (.conclusion // "")] | @tsv' | head -n 1)
            status=$(printf '%s' "$result" | cut -f1)
            conclusion=$(printf '%s' "$result" | cut -f2)
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "GitHub Pages deployment failed for $GITHUB_SHA."
                exit 1
              fi
              echo "GitHub Pages deployment succeeded for $GITHUB_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for GitHub Pages deployment for $GITHUB_SHA."
          exit 1
      - name: Verify the actual public site over HTTPS
        env:
          SITE_URL: https://famousnadroj-sys.github.io/malachite/
          EXPECTED_LIVE_CACHE: ${{ github.event_name == 'pull_request' && 'malachite-static-v108' || 'malachite-static-v114' }}
          EXPECTED_LIVE_CALLS_ASSET: ${{ github.event_name == 'pull_request' && 'calls.js?v=20261126-photo-cache-v3' || 'calls.js?v=20261127-jaas-dynamic-gate-v1' }}
        run: node scripts/smoke-live-pages.mjs
