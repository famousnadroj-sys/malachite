name: MALACHITE live Pages verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the actual public site over HTTPS
        env:
          SITE_URL: https://famousnadroj-sys.github.io/malachite/
        run: node scripts/smoke-live-pages.mjs
