name: Account deletion behavior contract

on:
  push:
    branches: [security/account-deletion-design-v1]
  pull_request:
    branches: [security/account-deletion-design-v1]

permissions:
  contents: read

jobs:
  account-deletion-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: malachite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d malachite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run disposable account-deletion behavior contract
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d malachite_test -v ON_ERROR_STOP=1 -f supabase/tests/account_deletion_behavior_contract.sql
